# SafeVision AI — Alembic Configuration
# Manages PostgreSQL schema migrations via SQLAlchemy models.

[alembic]
# Path to migration scripts (relative to this file)
script_location = migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Prepend sys.path so "app" package is importable from migration scripts
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

# Database URL — overridden at runtime by migrations/env.py from app.config
# sqlalchemy.url is intentionally left blank here; env.py sets it dynamically.
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format new migration files with ruff
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
